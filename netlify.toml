[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[edge_functions]
  directory = "netlify/edge-functions"

# 1) fallback SPA de l’app
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# 2) fallback SPA du site
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200